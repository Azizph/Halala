# ALLaM 7B through Ollama, for checking tonight how it handles dialect and Arabizi.
# Both tiers are ALLaM so every answer and rewrite comes from it. At the event, make large the bigger
# ALLaM model Humain gives you. "allam-7b" is the local name you give it with `ollama cp`.

[run]
limit_groups = 40

[floors]
latency_limit_s = 0       # no limit: laptop latency says nothing about a served model

[models.small]
backend = "ollama"
name = "allam-7b-q4-inst"  # built from configs/allam.Modelfile: ALLaM's real [INST] prompt format
params_b = 7
host = "http://127.0.0.1:11434"

[models.large]
backend = "ollama"
name = "allam-7b-q4-inst"
params_b = 7
host = "http://127.0.0.1:11434"

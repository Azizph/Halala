# Any OpenAI-compatible chat API (fill in once the organizers give you an endpoint).
# The key is read from the environment variable named in api_key_env, never from this file.

[run]
workers = 8

[models.small]
backend = "openai"
name = "SMALL-MODEL-ID"
params_b = 7
base_url = "https://api.example.com/v1"
api_key_env = "HALALA_API_KEY"
send_seed = true          # set false if the API rejects a seed parameter
usd_per_mtok_in = 0.0
usd_per_mtok_out = 0.0

[models.large]
backend = "openai"
name = "LARGE-MODEL-ID"
params_b = 34
base_url = "https://api.example.com/v1"
api_key_env = "HALALA_API_KEY"
send_seed = true
usd_per_mtok_in = 0.0
usd_per_mtok_out = 0.0

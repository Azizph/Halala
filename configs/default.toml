# Halala base configuration, on mock models. Other configs are layered on top and only list what they change.

[run]
data = "data/smoke_parallel.jsonl"
out_dir = "runs"
cache_path = "cache/calls.sqlite"
seed = 13
sealed = ""               # sealed test file; opened only by `sealed --unseal`

[cascade]
route_english = true      # English to the small model. Turn off when the hardware has no room for both models.

[models.small]
backend = "mock"          # mock | ollama
name = "mock-small"
max_tokens = 64
# mock only: chance of a correct answer for each detected form of the prompt it receives
mock_accuracy = { en = 0.92, msa = 0.88, dialect = 0.72, arabizi = 0.45, mixed = 0.62 }

[models.large]
backend = "mock"
name = "mock-large"
max_tokens = 64
mock_accuracy = { en = 0.97, msa = 0.97, dialect = 0.95, arabizi = 0.90, mixed = 0.93 }

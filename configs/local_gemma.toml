# The real setup: Gemma 3 4B and ALLaM 7B on one 4 GB GPU.

[run]
data = "data/saudi_parallel.dev.jsonl"
sealed = "data/sealed/saudi_parallel.test.jsonl"

[cascade]
route_english = false     # no room for both: Gemma cost 169% of ALLaM alone in mixed traffic (runs/local_gemma/measure_interleaved.md)

[models.small]
backend = "ollama"
name = "gemma3:4b"
host = "http://127.0.0.1:11434"

[models.large]
backend = "ollama"
name = "allam-7b-q4-inst"  # built from configs/allam.Modelfile: ALLaM's real [INST] prompt format
host = "http://127.0.0.1:11434"
num_ctx = 512              # the default 4096 reserves 2 GB, and these prompts need under 340 tokens
num_gpu = 28               # of 33 layers, for a 4 GB GPU: 2.5 times faster than Ollama's automatic 11

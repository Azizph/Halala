# Local models through Ollama (https://ollama.com). Stand-ins until you know which ALLaM models you get.
# To serve ALLaM 7B through Ollama, import a GGUF build with a Modelfile and put its name below.

[run]
limit_groups = 40         # keep live checks short on a laptop; set 0 for the full run

[floors]
latency_limit_s = 0       # no limit: laptop latency says nothing about a served model

[models.small]
backend = "ollama"
name = "qwen2.5:1.5b"
params_b = 1.5
host = "http://127.0.0.1:11434"

[models.large]
backend = "ollama"
name = "qwen2.5:7b"
params_b = 7
host = "http://127.0.0.1:11434"
